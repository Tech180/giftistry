name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        env:
          PGPASSWORD: ci
          COMPOSE_PROFILES: db
        run: docker compose -f docker/compose.yaml config >/dev/null

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Flake check
        working-directory: nix
        run: |
          mkdir -p /tmp/giftistry-ci/{giftistry-bun,giftistry-react,theming-engine}
          printf '%s\n' '{"name":"giftistry-api"}' >/tmp/giftistry-ci/giftistry-bun/package.json
          printf '%s\n' '{"name":"giftistry-react"}' >/tmp/giftistry-ci/giftistry-react/package.json
          printf '%s\n' '{"name":"theming-engine"}' >/tmp/giftistry-ci/theming-engine/package.json
          nix flake check \
            --override-input giftistry-bun path:/tmp/giftistry-ci/giftistry-bun \
            --override-input giftistry-react path:/tmp/giftistry-ci/giftistry-react \
            --override-input theming-engine path:/tmp/giftistry-ci/theming-engine
