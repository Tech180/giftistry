name: publish-images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (e.g. v0.0.25)'
        required: true
        type: string
      bun_ref:
        description: 'giftistry-bun ref (override versions.env)'
        required: false
        type: string
      react_ref:
        description: 'giftistry-react ref (override versions.env)'
        required: false
        type: string
      theming_ref:
        description: 'theming-engine ref (override versions.env)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4
        with:
          path: giftistry

      - name: Load version pins
        id: pins
        working-directory: giftistry
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source docker/versions.env
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          BUN_REF="${{ inputs.bun_ref }}"
          REACT_REF="${{ inputs.react_ref }}"
          THEMING_REF="${{ inputs.theming_ref }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "bun_repo=${GIFTISTRY_BUN_REPO}" >> "$GITHUB_OUTPUT"
          echo "bun_ref=${BUN_REF:-$GIFTISTRY_BUN_REF}" >> "$GITHUB_OUTPUT"
          echo "react_repo=${GIFTISTRY_REACT_REPO}" >> "$GITHUB_OUTPUT"
          echo "react_ref=${REACT_REF:-$GIFTISTRY_REACT_REF}" >> "$GITHUB_OUTPUT"
          echo "theming_repo=${THEMING_ENGINE_REPO}" >> "$GITHUB_OUTPUT"
          echo "theming_ref=${THEMING_REF:-$THEMING_ENGINE_REF}" >> "$GITHUB_OUTPUT"
          # Docker/OCI refs must be lowercase (GHCR rejects Tech180/…)
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Checkout giftistry-bun
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.bun_repo }}
          ref: ${{ steps.pins.outputs.bun_ref }}
          path: giftistry-bun
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Checkout giftistry-react
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.react_repo }}
          ref: ${{ steps.pins.outputs.react_ref }}
          path: giftistry-react
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Checkout theming-engine
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.theming_repo }}
          ref: ${{ steps.pins.outputs.theming_ref }}
          path: theming-engine
          token: ${{ secrets.APP_REPO_TOKEN || github.token }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push giftistry-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: giftistry/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.pins.outputs.owner }}/giftistry-server:${{ steps.pins.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.pins.outputs.owner }}/giftistry-server:latest
          build-args: |
            GIFTISTRY_VERSION=${{ steps.pins.outputs.tag }}
            GIFTISTRY_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push giftistry-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: giftistry/docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.pins.outputs.owner }}/giftistry-web:${{ steps.pins.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.pins.outputs.owner }}/giftistry-web:latest
          build-args: |
            GIFTISTRY_VERSION=${{ steps.pins.outputs.tag }}
            GIFTISTRY_SOURCE=https://github.com/${{ github.repository }}
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
